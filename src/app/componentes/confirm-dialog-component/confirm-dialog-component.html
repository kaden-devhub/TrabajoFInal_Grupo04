<div class="dialogo-cab">
  <span class="icono" [class.rojo]="data.peligro"><mat-icon>{{ data.icono || 'help' }}</mat-icon></span>
  <div class="titulos">
    <h2 mat-dialog-title>{{ data.titulo }}</h2>
  </div>
</div>

<mat-dialog-content>
  <p class="mensaje">{{ data.mensaje }}</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" mat-dialog-close>Cancelar</button>
  <button mat-flat-button type="button" [class.rojo-lleno]="data.peligro" [mat-dialog-close]="true">
    {{ data.confirmar }}
  </button>
</mat-dialog-actions>
