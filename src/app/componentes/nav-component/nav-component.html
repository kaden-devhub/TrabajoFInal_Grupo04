<mat-toolbar>
  <a class="marca" routerLink="/">
    <img class="logo" src="/images/logo.png" alt="ComparaSalud" />
    <span>ComparaSalud</span>
  </a>
  <span class="example-spacer"></span>
  <a mat-button routerLink="/">Home</a>

  @switch (auth.sesion()?.rol) {
    @case ('CLIENTE') {
      <a mat-button routerLink="/cliente/buscar">Buscar</a>
      <a mat-button routerLink="/cliente/ofertas">Ofertas</a>
      <a mat-button routerLink="/cliente/farmacias">Farmacias</a>
      <a mat-button routerLink="/cliente/favoritos">Favoritos</a>
      <a mat-button routerLink="/cliente/cuenta">Mi cuenta</a>
      <button mat-button type="button" (click)="cerrarSesion()">Cerrar sesión</button>
    }
    @case ('FARMACIA') {
      <a mat-button routerLink="/farmacia/ofertas">Mis ofertas</a>
      <a mat-button routerLink="/farmacia/medicamentos">Medicamentos</a>
      <a mat-button routerLink="/farmacia/perfil">Mi farmacia</a>
      <button mat-button type="button" (click)="cerrarSesion()">Cerrar sesión</button>
    }
    @case ('ADMINISTRADOR') {
      <a mat-button routerLink="/admin/resumen">Resumen</a>
      <a mat-button routerLink="/admin/categorias">Categorías</a>
      <a mat-button routerLink="/admin/farmacias">Farmacias</a>
      <a mat-button routerLink="/admin/clientes">Clientes</a>
      <a mat-button routerLink="/admin/medicamentos">Medicamentos</a>
      <button mat-button type="button" (click)="cerrarSesion()">Cerrar sesión</button>
    }
    @default {
      <a mat-button routerLink="/login">Iniciar sesión</a>
      <a mat-button routerLink="/registro">Registrarse</a>
    }
  }
</mat-toolbar>
